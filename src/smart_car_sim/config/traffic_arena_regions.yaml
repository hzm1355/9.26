# ============================================================================
# traffic_arena_regions.yaml —— 十字路口交通仿真区域定义
# ============================================================================
# 用于区域触发底座（region_trigger_node），坐标与 traffic_arena.world 一致。
regions:
  # 路口核心区
  - {id: INTERSECTION,   type: custom,         center: [0, 0, 1.0],       size: [12.0, 12.0, 3.0]}

  # 进口道检测区（车辆进入路口前触发）
  - {id: APPROACH_N,     type: speed_point,    center: [0, 15, 1.0],      size: [10.0, 2.0, 3.0]}
  - {id: APPROACH_S,     type: speed_point,    center: [0, -15, 1.0],     size: [10.0, 2.0, 3.0]}
  - {id: APPROACH_E,     type: speed_point,    center: [15, 0, 1.0],      size: [2.0, 10.0, 3.0]}
  - {id: APPROACH_W,     type: speed_point,    center: [-15, 0, 1.0],     size: [2.0, 10.0, 3.0]}

  # 出口道检测区
  - {id: EXIT_N,         type: checkpoint,     center: [0, 25, 1.0],      size: [10.0, 2.0, 3.0]}
  - {id: EXIT_S,         type: checkpoint,     center: [0, -25, 1.0],     size: [10.0, 2.0, 3.0]}
  - {id: EXIT_E,         type: checkpoint,     center: [25, 0, 1.0],      size: [2.0, 10.0, 3.0]}
  - {id: EXIT_W,         type: checkpoint,     center: [-25, 0, 1.0],     size: [2.0, 10.0, 3.0]}

  # 人行横道区域
  - {id: CROSSWALK_N,    type: custom,         center: [0, 8, 1.0],       size: [12.0, 2.0, 3.0]}
  - {id: CROSSWALK_S,    type: custom,         center: [0, -8, 1.0],      size: [12.0, 2.0, 3.0]}
  - {id: CROSSWALK_E,    type: custom,         center: [8, 0, 1.0],       size: [2.0, 12.0, 3.0]}
  - {id: CROSSWALK_W,    type: custom,         center: [-8, 0, 1.0],      size: [2.0, 12.0, 3.0]}

  # 停车线区域
  - {id: STOPLINE_N,     type: custom,         center: [0, 6.5, 1.0],     size: [10.0, 0.5, 3.0]}
  - {id: STOPLINE_S,     type: custom,         center: [0, -6.5, 1.0],    size: [10.0, 0.5, 3.0]}
  - {id: STOPLINE_E,     type: custom,         center: [6.5, 0, 1.0],     size: [0.5, 10.0, 3.0]}
  - {id: STOPLINE_W,     type: custom,         center: [-6.5, 0, 1.0],    size: [0.5, 10.0, 3.0]}
