# ============================================================================
# parking_zones.yaml —— 任务五（五）停车场车牌识别与闸机控制仿真的点位与参数
#
# 本文件是停车场模块的**唯一真值来源**，三处消费者都读它：
#   - tools/gen_parking_world.py  生成 world 内联 SDF（地面/划线/道闸/门架相机/线圈）
#   - parking_manager_node.py     核验→抬杆→通行→地感离场→落杆 的判定几何
#   - parking_shuttle_node.py     摆渡车的路线点位
# 改点位/尺寸只改这里，重跑生成脚本即可，不用手改 world 里散落的几十个数字。
#
# ── 占地是怎么核出来的（两个脚本互补，都可复跑）───────────────────────────────
# room_33 沙盘换算到世界系：wx=10*x、wy=-10*z、wz=10*y+6.7（模型 pose 0 0 6.7
# roll=90°、mesh scale=10，与任务三标定卡口抓拍点时用的是同一套换算）。
#
# (1) tools/survey_parking_footprint.py 按**顶点落格**统计"路面以上多少米有顶点"：
#   x 7.0..15.5 / y -13.5..-5.5，0.5 m 栅格 272 格 —— 受阻 0 格
#   x 7.4..14.6 / y -13.3..-5.6，0.25 m 栅格 899 格，门限路面+0.3 m —— 受阻 0 格
#   x 7.0..15.0 / y -14.0..-4.0，0.5 m 栅格，门限路面+0.9 m —— 受阻只在 y -4.5..-4.0
#   宽域 x 2..22 / y -20..6 才有 145 格受阻，且集中在 x≤5.5 与 x≥17。
#   即 Ring B 街区里这一整块在路面以上没有任何沙盘建筑/景观构筑物。
#   5 个 bldg_* 碰撞盒全在 y≥1 的北半边，与本场地无关。
#
# (2) tools/survey_parking_coverage.py 按**三角形精确覆盖格心**复核（顶点落格会漏判
#   大块平面：四角在框外的单个大四边形，框内每格顶点计数都是 0）：
#   x 7.4..14.6 / y -13.8..-5.5，0.25 m 栅格 957 格 —— 空洞 957、受阻 0。
#   也就是沙盘网格在这块**一片三角形都没有**（框内虽有 21.9 万个顶点，全部是
#   ~2 cm 的碎面聚在几小撮格子里，且都在路面以下）。
#   结论：停车场的地坪不能指望沙盘，必须由 gen_parking_world.py 自己铺一层
#   纯 visual 无碰撞的沥青面（顶面 z=6.712，压在 room_33 等效盒碰撞顶面 z=6.7 之上、
#   划线 z=6.715 之下）。车辆支承来自那个 50×6.7×51.2 的等效盒（顶面正好 6.7），
#   与网格无关，所以摆位高度沿用既有的 z=7.0 车姿不变。
#
# (3) 上面 (1)(2) 两项都是在**旧路网**下测的（当时 Ring B 东腿在 x=16.8）。任务 #77
#   重画路线后东腿挪到 x=14.5，车体走廊占 x 14.0..15.0，原场地东缘 14.60 与门架立杆
#   x=14.35、道闸杆尖 x=14.25 全压进走廊 —— 所以全场**沿 x 统一西移 1.60 m**，
#   内部相对几何（车道宽、杆长、相机俯角、路线步距）一字不变，标定继续有效。
#   新场地 x 5.80..13.00 已用 tools/lot_clearance.py 在同一张落地障碍高度图
#   （/tmp/route_height_map.json，与穿楼体检同一口径）上复测：
#     矩形 x 5.80..13.00 y -13.80..-5.50，0.25 m 栅格 924 格 —— 落地障碍 0 格
#   西缘 5.80 与 (1) 里"受阻集中在 x≤5.5"实测边界留 0.30 m；再往西就要重新勘测了。
#
#   碰撞约束：东西南三侧留足车道净空——南环西行车道中心 y=-16.8、东环南行车道中心
#   x=14.5（signal_drive_params.yaml），场地内所有带碰撞的静态件距车道中心 ≥1.5 m。
#   即东侧碰撞件必须 x ≤ 13.0（现最东的碰撞件是门架东立杆 x=12.75，间隙 1.75 m）。
#
# ── 分带（全场单向逆时针：南侧进、西侧出）──────────────────────────────────
#     门架带 G  y -7.05..-6.95   龙门架横梁 + 两台卡口相机（相机吊在车道中心线正上方）
#     停车带 A  y -8.85..-7.05   2 个垂直车位 P1/P2
#     通道带 B  y -11.05..-8.85  东西向通道，中心线 y=-9.55，入口地感在此带内
#     闸机线    y = -11.05       进/出两道道闸的杆轴（出口地感跨在杆轴上）
#     进出口带 C y -13.80..-11.05 入口车道(北行) + 出口车道(南行) + 中央分隔岛
#   南缘取 -13.80：复位段的原地转扫掠圆半径 hypot(1.6,0.8)/2=0.894，摆渡点在
#   y=-12.80，圆南缘 -13.69 必须仍在场内；同时 -12.80 让入口等待位与核验位之间
#   留出 0.6 m 的排队逼近段，而不是 0.3 m 的蠕动。沙盘在 y>-14.0 一侧净空已被
#   pitch 0.9 的宽域扫描（x7..15/y-14..-4.5）确认无障碍。
#   入口车道中心线 x=12.00，出口车道中心线 x=6.80，车道宽 1.30（车宽 0.80 的 1.6 倍）。
#   相机立杆/横梁必须整体退到**镜头平面之后**（north 侧），否则杆件会占满画面——
#   任务三卡口 v2 版就是栽在横臂前伸 6 cm 上，抓到 82% 是自家立杆。
#
#   一次"进场 + 出场"闭环 = 入口核验抓拍 → 抬杆 → 入口地感占用/释放 → 落杆 →
#   入库 P1 → 出场核验抓拍 → 抬杆 → 出口地感占用/释放 → 落杆 → 驶出，
#   共 2 次抬落杆、2 条通行记录（进场 1 条 + 出场 1 条）。
# ============================================================================
parking:
  frame: world
  road_z: 6.70           # 路面高程 = room_33 等效碰撞盒顶面，所有摆位的 z 基准
  floor_z: 6.712         # 自铺沥青地坪的顶面：沙盘网格在本场地一片三角形都没有
                         # （见顶部 (2)），地坪必须自己画；纯 visual 无碰撞，压在
                         # 6.70 支承面之上、划线 6.715 之下
  plate_z: 6.85          # 车牌面中心高程（沿用 gate_j3_north 的标定值）
  stripe_z: 6.715        # 划线/地面层高程：纯视觉无碰撞，不得与盒顶面 Z-fighting

  vehicle:               # 车体尺寸。车位/路线净空判定用真旋转矩形；地感占用判定
                         # 用的是外接方框（半边长 (长+宽)/2 = 1.2 m），故意放大 ——
                         # 漏判会落杆砸车，多判只是晚一点落杆。见 v2x_barrier_plugin.cc
                         # 的 loop 重叠判定，两个数由 gen_parking_world.py 写进 SDF。
    length: 1.60
    width: 0.80
    plate_ahead: 0.81    # 车头车牌面在 chassis 原点前方 0.81 m（车尾牌为 -0.81）
    axle_ahead: 0.40     # 驱动轮轴中点在 chassis 原点前方 0.40 m（world 里
                         # left/right_wheel_link 的 pose x=+0.40、脚轮 -0.40）。
                         # diff_drive 原地转的瞬时中心就在这条轴上，所以"转 Δyaw"会把
                         # chassis 原点甩出 2·0.40·|sin(Δ/2)|：实测转 90° 平移 0.578 m、
                         # 转 141° 平移 0.752 m，与公式的 0.573/0.752 对得上。摆渡车的
                         # approach 必须拿这条轴当受控点，否则一次转向就把车甩出到位圈。
    # 下面两个高度都是"相对路面"，取的是车 settle 之后的实测值：模型 pose z=7.0 只是
    # 初值，落定后 chassis 原点约在 6.70，碰撞盒 +0.25±0.20 → 顶面路面 +0.45，
    # 牌面片 +0.15±0.07 → 牌顶 +0.22。道闸杆放平必须夹在这两条之间：低于 0.45 才真
    # 能拦下车（否则"物理碰撞"是假的），高于 0.22 才不会抬落时刮牌。
    body_top: 0.45
    plate_top: 0.22

  lot:
    x0: 5.80
    x1: 16.50        # 东缘从 13.00 扩到 16.50：第三个原始车位（13.375..16.45）要纳入
                     # 场内。东扩后的全场 x 5.80..16.60 × y -13.90..-5.40 在同一张落地
                     # 障碍高度图上实测 0 格受阻（tools/pk114_eastleg221.sh，日志
                     # _diag155/eastleg221.log）。再往东 16.75 起就有 1.2 m 高的景观件。
    y0: -13.80
    y1: -5.50

  # ── 道闸动力学（v2x_barrier_plugin 驱动 revolute joint）─────────────────
  barrier:
    open_angle: 1.5708
    closed_angle: 0.0
    angle_tolerance: 0.08
    raise_timeout_s: 5.0     # 抬不到位 → FAULT，目标角保持抬起（安全侧）
    lower_timeout_s: 5.0     # 落不到位 → JAM 卡滞
    hold_time_s: 1.5         # 开到位后保持全开的时长，到点强制落杆
    clearance_delay_s: 0.5   # 地感释放后再落杆的确认延迟
    refuse_lower_while_occupied: true   # 落杆时杆下仍被占用 → 立即重抬（防砸车）
    effort: 300.0
    velocity: 2.0
    damping: 0.1
    friction: 0.05
    p_gain: 50.0
    d_gain: 5.0
    # ── 杆件与机箱的几何/质量（"尺寸可配置"就落在这里，gen_parking_world.py 只读不算）──
    # 截面 0.10 宽 × 0.06 高：真实道闸杆是椭圆铝杆，这里用等截面长方体，
    # 目的是让 ODE 有一个稳定的盒体碰撞面，而不是圆柱在车顶上滑开。
    section: [0.10, 0.06]     # [横向宽 m, 竖向高 m]
    mass_kg: 3.0             # 整杆质量；插件从这里读惯性做重力前馈（等效真实杆的拉簧配重）
    post_radius: 0.10        # 铰点柱与接收柱的碰撞圆柱半径
    # 柱高刻意压在杆的下表面之下（hub_z − 截面高/2 − 3 cm）：杆放平时若与柱顶接触，
    # ODE 会把它顶起来抖动，"落到位"的判定就永远在容差边缘反复。
    post_height: 0.24
    stub_back: 0.20          # 杆尾配重段长度，伸进机箱（机箱纯视觉无碰撞，不互顶）
    housing_size: [0.30, 0.26, 0.34]   # 机箱 [沿杆向, 横向, 高]，整体偏到车道外一侧
    state_rate: 20.0         # 插件发布 BarrierState 的频率 Hz（面板与取证都靠它）
    jam_effort_ratio: 0.90   # 实测力矩顶到 effort 的 90% 且角速度归零 → 判堵转/卡滞

  # ── 两道闸机 ──────────────────────────────────────────────────────────
  gates:
    - id: gate_in
      label: 入口闸机
      direction: in
      boom:
        pivot: [11.35, -11.05]      # 铰点在入口车道西侧路缘
        axis: [0, -1, 0]            # 该轴 + 正角度 = 抬起；杆向 +x 横越车道
        length: 1.30                # 正好等于车道宽
        hub_z: 0.30                 # 杆轴距路面：必须真能砸到车。车 settle 后 chassis
                                    # 碰撞盒只到路面 +0.45（模型 pose z=7.0 是初值，
                                    # 落定后原点约 6.70），0.75 的杆从车顶上方掠过去，
                                    # "物理碰撞"就是假的；0.30 压在车身中段，且高于
                                    # 牌面中心 +0.15，抬落过程不刮牌。
      camera:
        gate_id: gate_in                 # 与闸机 id / BarrierState.gate_id 同一个命名空间
        namespace: /parking              # 话题 = <namespace>/<camera_name>/image_raw
        # 吊在入口车道中心线正上方 2.25 m，视线与车流方向共面：俯角只压缩车牌高度，
        # 不压缩宽度。俯角 pitch=atan(drop/horizontal)=atan(2.10/4.35)=0.450，
        # 抓拍点落在 y=-7.05-4.35=-11.40，正是进场车停位时的**车头牌**位置。
        pose: [12.00, -7.05, 8.95, 0, 0.450, -1.5708]
        width: 1920
        height: 1080
        hfov: 0.6
        update_rate: 10
        clip_near: 0.05
        clip_far: 40.0
        capture_point: [12.00, -11.40]
        focus: [12.00, -11.21, 6.85]   # 相机瞄准点（俯角链的落点），不要动它
        # near_radius 必须**大于**"停稳点到 focus 的距离"：停位点到 focus 正好 1.00 m，
        # 而摆渡车到位半径 0.12 m、首轮实测停在 y=-12.31（离 focus 1.10 m）。
        # 按 1.0 写死就是"卡在阈值上"，车停早一点就永不武装、零抓拍（整栈重启后实测）。
        near_radius: 1.4               # 必须满足 1.10 < R < 1.94：停稳点（1.10 m）在内、
                                       # 等待位（2.74 m）与原地转机动最近点（1.94 m）都在外
        far_radius: 2.5                # 车驶入通道带后必越过 2.5 m，下一轮才能重新武装
        render_lag: 0.0
        # 触发后最多等渲染线程出一帧有内容的图的**仿真秒数**。实测（tools/cam_rate.py
        # 20 s 窗，RTF 0.950）：全场景四路 1080p 卡口相机共用一个渲染线程，出帧间隔
        # 中位 0.20 s、90 分位 0.6~0.7 s、最大 1.6 s —— 这不是停车场相机被拖垮，
        # 任务三那两道一模一样，所以分辨率/帧率都不动，只把等待抬到最大间隔的 1.8 倍。
        # 敢等这么久是因为摆渡车在核验位是**停着的**（arrive_radius 0.12），
        # 等帧期间位置不动，不像任务三的高速档那样"等一秒就偏出一米"。
        frame_wait: 3.0
        # 超时放弃后立即解除武装：核验位是停着等的，而进场车道内离 focus 最远只 1.66 m，
        # 越不过 far_radius 2.5。缺这一项时一次"3 s 没出帧"就把这道闸永久锁死——
        # 车在核验位/等待位之间空转、整轮零抓拍（2026-10-12 整栈重启后实测复现）。
        rearm_on_fail: true
        capture_dir: /tmp/v2x_parking_in
        image_topic: /parking/gate_in/image_raw
      loop:
        id: PKG-in-loop
        label: 入口地感线圈
        # 跨在杆轴上（与出口同一规矩），不是杆轴北侧。原值 -10.35 让占用框南缘落在
        # -11.95，而车头碰到放平的杆是在 -11.85：只提前 0.10 m 检出，比 arrive_radius
        # 0.12 还短。实测（2026-10-12 14:15）因此演成了砸车 —— 核验位 -12.21 到检出
        # 点要爬 0.26 m，按巡航 0.25 m/s 至少 1.3 s，比 hold_time_s 1.5 s 慢，
        # 于是"到点且地感始终空闲"的分支先落杆，车随后顶在放平的杆上，
        # clear_s 永远 -1、线圈再也压不上去（整条车道 deadlock）。
        # 现在 -10.75：占用框 [-12.35, -9.15] → 车头距杆还有 0.50 m 就已占用，
        # 车尾越过杆轴 0.90 m 才释放；等待位 -12.80 仍在框外，上升沿照旧成立。
        # ── 2026-10-16 三修：中心南移到 -10.90、y 向尺寸 0.80 → 1.10 ──
        # 上面那条"等待位仍在框外"用的是 -12.80，等待位南移到 -13.95 后这句话只是
        # 更成立；但 -10.75/0.80 这组数把**核验位**压到了框南缘以北只有 0.14 m 的地方：
        # 占用框半边 = (车长+车宽)/2 + 线圈半宽 = 1.20 + 0.40 = 1.60，核验位 -12.21
        # 距框南缘 -12.35 只 0.14 m，而 arrive_radius 就是 0.12 m —— 到位残差一抖，
        # 占用翻成"释放"，manager 的 0.5 s 释放确认一到就落杆（pk185 实测：开到位只
        # 3.30 s 就落，正常轮是 8.1/11.6 s，而车还在杆南 0.36 m 没进场），于是
        # 摆渡车等 30 s 不见杆 → 倒车退回 → 再进场带 10° 偏西楔进入口闸机箱柱。
        # 走廊本身被两条线夹死：框南缘要盖住核验位（否则永不占用），核验位又必须在
        # 杆轴以南 ≥0.35 m（否则落杆顶车头，就是条目 3 的防砸演出），两者之间只剩
        # 0.20 m。所以动框不动位：线圈跨到杆轴以南、y 向加宽 0.30，让南缘退到 -12.65
        # （核验位余量 0.14 → 0.44），**北缘 -9.15 一字不动** —— 释放线、通道带
        # （-9.55 在框外 0.40 m）、出场西行带（-8.90 在框外）全部保持原语义。
        # 出口那道不动：它的核验位 -9.95 距框北缘 -9.15 有 0.80 m，本来就不紧；
        # 若把出口框也南扩，reset#0 (-12.55) 会落进框内 0.10 m，落杆动作会被
        # 防砸重抬多演一次，那是新增噪声不是修缺陷。
        center: [12.00, -10.90]
        size: [1.30, 1.10]
      staging_point: [12.00, -13.95]   # 进场等待位（静止 2.74 m、机动最小 1.94 m 均在 R=1.4 圈外）
      queue_point: [12.00, -12.21]     # 核验停车位：车头距闸杆 0.20 m

    - id: gate_out
      label: 出口闸机
      direction: out
      boom:
        pivot: [7.45, -11.05]       # 杆向 -x 横越出口车道
        axis: [0, 1, 0]             # 该轴 + 正角度 = 抬起
        length: 1.30
        hub_z: 0.30                 # 同 gate_in：杆放平要夹在车身顶 0.45 与牌顶 0.22 之间
      camera:
        gate_id: gate_out                # 与闸机 id / BarrierState.gate_id 同一个命名空间
        namespace: /parking
        # 出口车南行、拍到的是车尾牌：车停在核验位时车尾牌在 y=-9.14，
        # pitch=atan(2.10/2.09)=0.788（3.03 m 拍摄距离，车牌宽约 640 px）
        pose: [6.80, -7.05, 8.95, 0, 0.788, -1.5708]
        width: 1920
        height: 1080
        hfov: 0.6
        update_rate: 10
        clip_near: 0.05
        clip_far: 40.0
        capture_point: [6.80, -9.14]
        focus: [6.80, -10.95, 6.85]    # 相机瞄准点（车从北边来，在南侧 1.00 m 处）
        # 同 gate_in：停位点到 focus 正好 1.00 m，按 1.0 写死就卡在武装阈值上，
        # 到位残差 0.12 m 一偏就零抓拍。上界由出场后的终点保证（离 focus 1.85 m）。
        near_radius: 1.4
        far_radius: 2.5
        render_lag: 0.0
        frame_wait: 3.0                # 同 gate_in：核验位是停稳点，等帧不引入位置残差
        rearm_on_fail: true            # 同 gate_in：出场车道内同样越不过 far，失败必须能重试
        capture_dir: /tmp/v2x_parking_out
        image_topic: /parking/gate_out/image_raw
      loop:
        id: PKG-out-loop
        label: 出口地感线圈
        center: [6.80, -10.75]      # 跨在杆轴北侧：等待时占用，驶离时释放=离场
        size: [1.30, 0.80]
      queue_point: [6.80, -9.95]        # 出场核验/缴费停车位
      staging_point: [6.80, -12.55]     # 出场后的终点（出口外等候区；2026-10-16 随
                                        # reset#0 北移 0.25，文档口径与航线一致）

  # ── 车位 ─────────────────────────────────────────────────────────────
  # 这三位**不是我们自己划的**，是原始沙盘 room_33.obj 里就标好的停车位。实测来源
  # （勘查脚本都在 tools/，日志在 _diag155/）：
  #   4 条贴地白色分隔线（材质组 白色分隔线331）在 x ≈ 7.225 / 10.305 / 13.375 / 16.45，
  #   跨 y -11.63..-7.03  ->  pk110_patches217.py + pk111_matfaces218.py
  #   一块贴地绿色矩形（Standardmaterialdd3333.001）x 7.30..16.37 × y -11.48..-7.18
  #   就是这三位的底色  ->  pk107_green214.py + pk108_greenfaces215.py
  # 也就是"线间三位、每位的宽 = 相邻两条线之差、深 = 线长"，位中心
  # x = 8.765 / 11.840 / 14.915，位中心 y = -9.33。之前看到的"两个黑色车位"是我们
  # 后铺的沥青（x0..13.00）盖住了西两位的绿底，东那位在沥青之外所以还是绿的 ——
  # 现在全场东扩到 16.50 把三位一并纳入，并按实测坐标重画，颜色统一。
  #
  # 中间那位 PKG-P2 **只画不停**：标定好的入口车道中心线 x=12.00 正好在它的足迹
  # （10.305..13.375）里，摆渡车进场要沿它穿到通道带。挪车道=重标入口相机俯角链
  # （pitch 0.450 / focus (12.00,-11.21) / capture_point 一整套），条目 1/3/4 三段
  # 已定稿视频全部要重录，所以保留 P2 为空、把两次停放分给 P1 与 P3。
  # 车位带的南缘 -11.63 在闸杆线 y=-11.05 以南 0.58 m，即两道闸横穿三位靠南的一端：
  # 车停在闸机线以北，"过杆才入库"的语义与沙盘划线并不冲突。
  stalls:
    - id: PKG-P1
      center: [8.765, -9.33]
      size: [3.080, 4.600]         # 宽 = 10.305-7.225，深 = -7.03-(-11.63)
      heading: 1.5708              # 车头朝北，由通道带原地转正后前进入库
    - id: PKG-P2
      center: [11.840, -9.33]
      size: [3.070, 4.600]
      heading: 1.5708
    - id: PKG-P3
      center: [14.915, -9.33]
      size: [3.075, 4.600]
      heading: 1.5708

  # ── 划线几何（gen_parking_world.py 画地面、边线、车位、线圈框）──────────
  stripes:
    gantry:
      y: -7.05
      z_center: 9.10                  # 横梁中心高程：下表面 9.03 正好压在相机机壳顶
                                      # （相机 z 8.95 + 壳半高 0.08）之上，不互相穿插
      x0: 6.05
      x1: 12.75
      masts: [[6.05, -7.05], [12.75, -7.05]]   # 两根立杆都在两条车道中心线之外
      beam_size: [6.70, 0.12, 0.14]
      mast_radius: 0.09             # 立杆碰撞圆柱半径，与任务三门架同规格
      mast_top_pad: 0.18            # 立杆高出横梁顶面的那一截，视觉上是"杆头"
    aisle:
      center_y: -9.55
      x0: 6.80
      x1: 15.40                  # 原 12.00：东那位（P3）的入库 mouth 在 x=14.915，
                                 # 通道带要一路画到它以东。当时再往东就贴上环道东腿
                                 # （16.20 时代车体西缘 15.80），所以停在 15.40；现在
                                 # 东腿外绕到 x=20.80，这一格与车道已无关系，长度保持
                                 # 不动（划线无碰撞，纯视觉，改了会连带动 world 生成物）
      width: 2.20
    lane_in:
      center_x: 12.00
      x0: 11.35
      x1: 12.65
      y0: -13.80
      y1: -11.05
    lane_out:
      center_x: 6.80
      x0: 6.15
      x1: 7.45
      y0: -13.80
      y1: -11.05
    median:                        # 中央分隔岛：闸机控制箱与岗亭摆位
      x0: 7.45
      x1: 11.35
      y0: -13.80
      y1: -11.05
      booth: [9.40, -11.30]        # 挪到岛的北端：既要让开通道带以下的复位直行段，
                                   # 也要与南环车道中心线 y=-16.8 留出 1.5 m 碰撞净空
      booth_size: [1.00, 1.00]      # 岗亭平面尺寸
      booth_height: 2.20            # 带碰撞，所以它距任何车道中心必须 ≥1.5 m（体检脚本第 5 段查）

  # ── 摆渡车（独立 parking_shuttle_node 驱动，不进车流）────────────────────
  # 上场的是 car_3（京B88990，白名单月租）与 car_2（粤Z1A2B3，白名单外→临时车登记），
  # 两套航线在下面的 fleets 里按模型名给。下面这一组 entry/exit/reset 是 car_6 时代
  # 标定过的旧航线，**原样留着**：一是 fleets 缺项时的兜底，二是改点位后还能拿它
  # 复跑离线自测（tools/pk_shuttle_selftest.py）对同一条基线。
  shuttle:
    model: car_6
    prefix: car_
    chassis_link: chassis
    # car_6 的出生格。2026-10-14 用户指定摆渡改用已在场的 car_2 / car_3，car_6 退役，
    # 但**不删模型**（world 里那份内联 SDF 由 gen_parking_world.py 生成，删了就把条目
    # 1~4 已有的 car_6 标定一起删了）。退役后它不能还停在 (12.00,-12.80) —— 那格现在
    # 是 car_3 的出生位，两台模型同格加载会被物理引擎互顶弹射（见记忆「摆位弹射与
    # 复位风暴」）。这一格挪到沙盘东南角 (23.50,-23.50)：lot_clearance 实测该 2×2 m
    # 矩形落地障碍 0 格（tools/pk118_hmextent225.sh → _diag155/car6pad225.log），
    # 离最近的行车道中心（东环南行 x=20.80、南环西行 y=-16.80）各 2.70 / 6.70 m，
    # 车格西缘 22.50 与东环车体东缘 21.20 留 1.30 m，既不进任何航线，也不参与任何判定
    # （插件按 shuttle.prefix 过滤的是模型名，
    # manager 只认相机回包，car_6 不触发抓拍就没有通行事件）。
    # 不选停车场里的空车位 P2 当停车点：car_3 出场西行走 y=-8.90 那条带，P2 内停车辆
    # 南缘只留 0.15 m，会被布局体检"碰撞件距车道中心 ≥1.5 m"判死。
    park_pose: [23.50, -23.50, 0.0]
    # 用户三轮都提了"适当加速"。前两轮是**成倍**改、比值一字不动：
    #   第一轮 0.25→0.45 / 0.35→0.63，第二轮 0.45→0.70 / 0.63→0.98，
    #   v/ω 恒为 0.714 —— 行车支饱和时的最小转弯半径 r=v/ω 就是航线几何本身
    #   （approach 里"不带着饱和角速度行车"那条 drive_tol 也按这个比值写），
    #   单改 v 不改 ω 会把 0.71 m 的转弯半径撑大，原来贴着装好的转向点就进不了到位圈。
    # 第三轮（2026-10-17，条目 128）0.70→0.85 / 0.98→1.19，同样只改倍数不改比值：
    #   0.85/1.19 = 0.71428… 与 r=0.71 m 逐位一致；drive_tol = min(0.30, turn/1.5)
    #   里 turn/1.5 从 0.653 涨到 0.793，仍被 0.30 夹住 → 行车支判据一字未动；
    #   SPIN_SETTLE_RATE=0.35 / SPIN_SETTLE_BAND=1.00 是**对齐段**的独立上限，不参与
    #   这次缩放，所以 #104 的刹车行程门（BRAKE_LAG·ω+ω²/2RATE_W 在 ω=0.35 时 0.18 rad）
    #   口径不变 —— 提速只把"远离目标的大角度"那段变快，贴着 ALIGN_TOL=0.05 的那段没动。
    #   斜坡 RATE_V=0.60 / RATE_W=1.50 仍按 world 物理参数（max_wheel_acceleration=6
    #   rad/s² × 轮半径 0.10 = 0.6 m/s²；轮距 0.70 → 绕轮轴 1.71 rad/s² 取 1.5 留余量）：
    #   顶到 0.85 要 1.42 s、顶到 1.19 要 0.79 s，插件追得上，不会把轮速积成弹射。
    # cruise_speed 0.85 是对齐 signal_drive_params.yaml 五条路线的同名值 ——
    # 摆渡车与其它车同速，画面里不会出现"社会车辆超车"那种既不像自主循环、又要
    # 在镜头里避让的形态。
    # 执行层三条常量（RATE_V=0.60、RATE_W=1.50、MIN_V/MIN_W）跟着 world 的物理参数走，
    # 不跟着巡航值走。
    # 到位残差不会因为提速而变大：approach 的限速律是 min(cruise, dist/0.6)，提速后
    # 这条律从 0.51 m 开始起作用（原来 0.42 m），进 0.12 m 圈时同样只剩约 0.20 m/s；
    # 核验位停稳后是零速等帧（frame_wait 3.0），抓拍位置由"停稳点"而不是巡航速度决定。
    cruise_speed: 0.85
    turn_speed: 1.19
    arrive_radius: 0.12
    stall_dwell_s: 12.0
    # 一轮的理论周期。离线自测实测：从等待位起、两段杆都抬起，跑完
    # 进场→出场→复位回到等待位要 1962 拍 × 0.05 s = 98 s 仿真时间（轮轴补偿后
    # 每个转向点多了一段 0.57 m 的轮轴重定位，比补偿前的 86 s 长了 12 s）。
    # 所以这个数必须大于 98 s，否则"凑周期"那一支永远走不到，节点就变成
    # "跑完立刻起下一轮"，取证脚本按周期预告通行时刻会逐轮漂 8 s 以上。
    # 98 s 是 0.45 m/s 那版标定的下限；提速到 0.70 后同一航线只会更短，120 s 仍然是
    # 安全侧（余量更大）。真要按新速度收紧这个数，得先拿一轮实测周期，别按 0.70/0.45
    # 反比例折算 —— 周期里停等抓拍、等抬杆、车位 dwell 这些段不吃巡航速度。
    loop_period_s: 120.0
    # 每个点 = [x, y, 到位后车头朝向]；转向用原地旋转，车体扫掠圆半径
    # hypot(1.60,0.80)/2 = 0.894 m，所有旋转点都选在圆内无障碍、且不越场界的位置
    entry_route:
      - [12.00, -12.80, 1.5708]    # 等待位
      - [12.00, -12.21, 1.5708]    # 核验位（触发入口抓拍）
      - [12.00, -9.55, 1.5708]     # 过杆后进入通道带
      - [12.00, -9.55, 3.14159]    # 原地转成西行
      - [8.40, -9.55, 3.14159]
      - [8.40, -9.55, 1.5708]      # 原地转成北行
      - [8.40, -7.95, 1.5708]      # 车位 P1
    # 出场西行段走 y=-9.00 而不是通道带中心线 -9.55：闸机插件的抓拍触发是
    # "底盘到 focus(6.80,-10.95) 的水平距离 <= near_radius 1.4" 的上升沿，而 -9.55
    # 这条线与 1.4 m 触发圈正好**相切于 (6.80,-9.55)** —— 那格又是"转南行"的原地转
    # 向点，于是抓拍必然拍在车正横着转的那一拍（2026-10-13 实拍：gate_out-5 车顶占满
    # 画面、牌面侧对镜头；gate_out-6 车只在左上角露一角，两张都"未定位到车牌"）。
    # 北移 0.55 m 后转向点在圈外（离 focus 1.95 m），转完南行再直行穿圈，穿圈那一拍
    # 车头正南、车尾牌正对相机；剩余 0.40 m 的早拍量（触发在核验位以北）与进场那道
    # 同量级，在 pitch 0.788 的竖场 ±0.171 rad 内（牌心偏轴 0.108 rad），不动 world。
    exit_route:
      - [8.40, -7.95, -1.5708]     # 原地转成南行
      - [8.40, -9.00, -1.5708]
      - [8.40, -9.00, 3.14159]     # 转西行（此时离 focus 2.37 m，圈外）
      - [6.80, -9.00, 3.14159]
      - [6.80, -9.00, -1.5708]     # 转南行：这一格在触发圈外 0.55 m，是本轮改的要点
      - [6.80, -9.95, -1.5708]     # 核验位（穿圈抓拍发生在 y=-9.55，车此时已对齐南行）
      - [6.80, -12.80, -1.5708]    # 过杆驶出
    reset_route:
      - [6.80, -12.80, 0.0]        # 转东行，沿进出口带回到入口等待位（全程不越杆）
      - [12.00, -12.80, 0.0]
      - [12.00, -12.80, 1.5708]

    # ── 分队航线：按模型名覆盖上面三段，节点用 --ros-args -p model:=car_3 选 ──
    # 谁停哪位是**被几何逼出来的**，不是随便点的：出场都要从自己那位沿通道带西行到
    # 出口车道 x=6.80，所以"停在东那位 P3 的车"的 westbound 段会从 P1 头顶上扫过去。
    # 于是只能让**先跑的那辆停东、后跑的那辆停西** —— 后停车的那辆一出场就不用再
    # 越过前一辆的泊位。因此：
    #   car_3（月租/白名单）先跑 -> P3（东那位，列 x=14.915 = 标线中心）
    #   car_2（临时车登记）后跑 -> P1（西那位，列 x=8.40，沿用原标定列）
    # P3 那一列取位中心 x=14.915：2026-10-14 之前它取 13.90，是因为环道东腿当时在
    # x=16.20，原地转的扫掠圆东缘 15.565 与环道车体西缘 15.80 只剩 0.235 m，只能把
    # 这一列往西挤。现在东腿整条外绕到 x=20.80（停车场占地 16.50 以东 4.30 m，
    # 判据 tools/route_lot_conflict.py 退出码 0），这个约束就不存在了，回到"车停在
    # 标线正中间"：车体 14.515..15.315 在 P3 标线 13.377..16.453 之内，转点位
    # (14.915,-9.55) 的扫掠圆东缘 16.21 仍不越场界（check_parking_layout.py 第 4 段）。
    # 出场西行段用 y=-8.90 而不是 -9.00：入口地感的占用框是插件按
    # "|车心-loop| <= (长+宽)/2 + 线圈半宽" 算的轴对齐盒，实测 = x 10.15..13.85、
    # y -12.35..-9.15；-9.00 只剩 0.15 m 余量，位姿噪声一抖就把已经落杆的入口闸
    # 重新"占用"一次（refuse_lower_while_occupied 会把放下的杆再顶起来，这是
    # 条目 3 的防砸演出，不是我们要的噪声）。-8.90 给到 0.25 m，同时仍在
    # gate_out 触发圈（focus 6.80,-10.95 / near 1.4）之外 2.05 m。
    # ── 2026-10-16：car_3 等待位从 (12.00,-12.80) 南移到 (12.00,-13.95) ──
    # 旧位上静止离 gate_in focus 只有 1.59 m，而 reset 末段要在它的转点
    # (12.00,-12.40) 绕轮轴原地转 90°：底盘原点甩到最北时离 focus 仅 0.79 m，
    # 切进 near 1.4 的触发圈误拍一帧（P0019，d=1.4000，置信 0.1671）——误拍与真
    # 抓拍一样置 armed=true，而进场车道内 d 最大只有 1.59 < far 2.5 永远清不掉，
    # 于是后续所有真实接近全被静音 → 整轮零抓拍 → 等杆超时 ×3 → 停驶挂起。
    # 南移后（判据 tools/pk184_clearprechk308.py，退出码 0）：
    #   * 静止 2.74 m > far 2.5（余量 0.24）——每轮回到等待位自动清锁，误拍自愈
    #   * 原地转机动底盘原点最小 1.94 m（距 near 余量 0.54）——机动全程在圈外
    #   * 触发线 y=-12.61 与取景几何不动；触发线处车速 0.48 → 0.67 m/s（助跑 1.34 m）
    # 只动 entry#0 与 reset#1/#2 三点；核验位、通道带、车位、出口段全部不动。
    fleets:
      car_3:
        entry_route:
          - [12.00, -13.95, 1.5708]   # 等待位（= world 里 car_3 的出生位，2026-10-16 随本行一起南移；自跑到此不穿触发圈）
          - [12.00, -12.21, 1.5708]   # 核验位：触发入口抓拍
          - [12.00, -9.55, 1.5708]    # 过杆后进入通道带
          - [12.00, -9.55, 0.0]       # 原地转成东行
          - [14.915, -9.55, 0.0]
          - [14.915, -9.55, 1.5708]   # 原地转成北行
          - [14.915, -7.95, 1.5708]   # 车位 P3（停在标线中心）
        exit_route:
          - [14.915, -7.95, -1.5708]  # 原地转成南行
          - [14.915, -8.90, -1.5708]
          - [14.915, -8.90, 3.14159]  # 转西行（离 focus 2.05 m，圈外）
          - [6.80, -8.90, 3.14159]    # 长直行：越过 P2 与入口车道口，全程在 -9.15 以北
          - [6.80, -8.90, -1.5708]    # 转南行
          - [6.80, -9.95, -1.5708]    # 出场核验位（穿圈抓拍）
          - [6.80, -12.55, -1.5708]   # 过杆驶出
        reset_route:
          - [6.80, -12.55, 0.0]       # 出口侧转点（2026-10-16 北移 0.25：见下注）
          - [12.00, -13.95, 0.0]      # 东行斜线到新等待位正南（航向 -15.1°，余量 +0.67）
          - [12.00, -13.95, 1.5708]   # 原地转北回等待位朝向（机动最小 1.94 m 出圈）
      # ── 2026-10-16 二修：出口侧转点 (6.80,-12.80) 北移 0.25 到 (6.80,-12.55) ──
      # 等待位南移上线后 pk183 实测两轮完整，第三轮却在 reset#0 挂起：转点停在
      # (6.85,-12.83)（容差内偏南 0.03），轮轴 (6.80,-13.23)，相位①的 36.4° 过冲样本
      # 车尾角最深 y=-14.49，吃进 c131（北缘 -14.25）0.24 m，绕楔点猎振把 6.3 rad
      # 原地转预算烧尽。根因不是南移引入的——旧转点 pk184 相位余量只有 +0.016 m，
      # **小于 arrive_radius 0.12 的正常到位残差**，前两轮能过纯属停位残差恰好偏北。
      # 教训：净空余量必须盖住到位残差。北移后（pk184 场景叠 ±0.08 停位偏差重跑）：
      #   * reset#0 相位包络最小 +0.186 m（c131），含偏差仍为正
      #   * 出口链路不受影响：车心 y=-12.55 距出口 loop 中心 (6.80,-10.75) 1.8 > 1.6
      #     不再占用（占用框 y∈[-12.35,-9.15]，离场落杆沿不变）；车体距 boom_col
      #     南缘（-11.10）0.65 m；核验位/抓拍几何不动
      # 不删 c131：它是画得出来的有形块（"混泥土"），无用户授权不动。
      # car_2 多一个"场外排队位" entry#0：它要在 car_3 已经停在 P3 之后再进场，
      # 而 12.00,-12.80 那格是 car_3 的等待位/周期起点，两车不能同时占。排队位取
      # y=-14.60 是双约束夹出来的：离入口 focus 3.39 m，必须越过 far_radius 2.5 才
      # 能重新武装抓拍（否则第二轮零抓拍），又必须与南环西行车道中心 y=-16.8 的车体
      # （-17.2..-16.4）留出净空 —— 取 -14.60 时车体 -15.40..-13.80，留 1.80 m。
      # reset 末点落回同一格（车头朝南），下一轮 approach 会在原地转 180° 再前进，
      # 看着就是"排队位掉头重新进闸"，抓拍武装链路自洽。
      # ── 2026-10-16：这一分队**默认不启用**（用户指令：只用 car_3 在停车场里，
      # car_2 回归正常行驶赛道）。停车场是单车道的 —— 入口/出口车道和通道带复位段都是
      # 同一条，两个 shuttle 实例各自按 loop_period_s 自主循环必然在通道带对顶，那不是
      # 调度是撞车，所以 start_parking_nodes.sh 默认 SHUTTLE_MODELS=car_3 只起一辆。
      # 这份航线**原样留着不删**：条目 4 的"临时车登记"分支只有非白牌车才走得通
      # （car_3 是月租白名单，命中的是另一支），要录那一支时按串行窗口临时换车 ——
      # 先停 signal_drive_node 并把 signal_drive_params.yaml 里 car_2 置回 drive: false，
      # 再 SHUTTLE_MODELS=car_2 重跑本脚本，演完立刻归队。
      car_2:
        entry_route:
          - [12.00, -14.60, 1.5708]   # 场外排队位（world 里 car_2 的出生位）
          - [12.00, -12.80, 1.5708]   # 等待位
          - [12.00, -12.21, 1.5708]   # 核验位
          - [12.00, -9.55, 1.5708]
          - [12.00, -9.55, 3.14159]   # 原地转成西行
          - [8.40, -9.55, 3.14159]
          - [8.40, -9.55, 1.5708]     # 原地转成北行
          - [8.40, -7.95, 1.5708]     # 车位 P1
        exit_route:
          - [8.40, -7.95, -1.5708]
          - [8.40, -9.00, -1.5708]
          - [8.40, -9.00, 3.14159]
          - [6.80, -9.00, 3.14159]
          - [6.80, -9.00, -1.5708]
          - [6.80, -9.95, -1.5708]
          - [6.80, -12.80, -1.5708]
        reset_route:
          - [6.80, -12.80, 0.0]
          - [12.00, -12.80, 0.0]
          - [12.00, -12.80, -1.5708]  # 转南退回排队位
          - [12.00, -14.60, -1.5708]

  # ── 管控逻辑 ─────────────────────────────────────────────────────────
  control:
    # 车牌真值兜底：/plate/number 是易失话题，节点晚于贴牌启动就收不到
    plates:
      car_6: 沪A12345
      car_3: 京B88990              # 白名单月租 -> 走"核验通过→抬杆"主链路，停 P3
      car_2: 粤Z1A2B3              # 白名单外 -> 走 unknown_as_temp 的临时车登记分支，停 P1
    whitelist:
      沪A12345: {kind: monthly, label: 月租车}
      京B88990: {kind: monthly, label: 月租车}
    # 未登记车牌走"临时车登记→发临时卡→放行"分支；false 则未登记直接拒入
    unknown_as_temp: true
    temp_ticket_ttl_s: 3600.0
    blacklist: []                  # 黑名单车牌：命中则拒绝抬杆并告警
    # 抓拍→识别结果的最长等待。底数是实测：相机出帧间隔最大 1.6 s（四路 1080p
    # 卡口共用一个渲染线程，见 camera.frame_wait 那段注释），抓拍本身要等满
    # frame_wait=3.0 s 才可能放弃；参考识别器单帧 process_ms 常年几百毫秒，
    # 所以 8 s = 3.0 等帧 + 1.6 渲染抖动 + 3 倍余量。超时按"识别失败"处理，
    # 不猜车牌号 —— 猜出来的号一旦命中白名单就是假放行。
    verify_timeout_s: 8.0
    # 手动控制与故障注入话题（同时保留对应 srv 服务）
    manual_cmd_topic: /parking/gate_manual_cmd     # std_msgs/String: gate_id:rad
    fault_topic: /parking/fault_inject             # std_msgs/String: gate_id:FAULT_KIND
    fault_kinds: [STUCK, RAISE_FAIL, SENSOR_FAIL, NO_CLOSE]
    state_topic: /parking/gate_state                # BarrierState（manager 叠加逻辑态后转发）
    pass_topic: /parking/pass                       # ParkingPass（一次通行一条）
    action_topic: /parking/actions                  # ParkingAction（每一次抬/落/保持/故障一条）
    whitelist_srv: /parking/whitelist                # v2x_msgs/srv/SetParkingWhitelist
    gate_srv: /parking/gate                          # v2x_msgs/srv/SetParkingGate

  # ── 记录管理 ─────────────────────────────────────────────────────────
  records:
    dir: /tmp/v2x_parking
    pass_file: parking_pass.jsonl      # 进场/出场通行记录（含车牌、时间、闸机、结果）
    action_file: barrier_actions.jsonl # 闸机动作日志（抬杆/落杆/故障/手动）
    csv_encoding: utf-8-sig
    export_topic: /parking/export      # 实为 v2x_msgs/srv/ParkingExport 服务（同名话题只是别名）
    max_records_in_memory: 5000
