# ============================================================================
# 智能小车配置 —— smart_car_spawner.py 读取
# ============================================================================
# 支持多车型预设（presets），每辆车引用一个预设并可覆盖任意参数。
# 所有单位：米 / 千克 / 弧度 / 秒。
# 话题命名空间：/<car_name>/cmd_vel, /<car_name>/scan, /<car_name>/imu/data 等。
# ============================================================================

presets:
  # ---- 小型配送机器人 ----
  delivery_bot:
    mass: 30.0
    length: 0.8
    width: 0.6
    height: 0.35
    wheelbase: 0.5
    wheel_radius: 0.06
    wheel_width: 0.05
    wheel_separation: 0.5
    max_speed: 1.5
    max_acceleration: 2.0
    priority: 1
    color: [0.2, 0.7, 0.3]
    sensors:
      lidar:
        update_rate: 10
        samples: 360
        min_range: 0.08
        max_range: 15.0
        noise_stddev: 0.008
      imu:
        update_rate: 200
      camera:
        update_rate: 15
        hfov: 1.0
        width: 320
        height: 240
        far_clip: 50

  # ---- 中型轿车（默认） ----
  medium_car:
    mass: 80.0
    length: 1.6
    width: 0.8
    height: 0.4
    wheelbase: 1.0
    wheel_radius: 0.1
    wheel_width: 0.08
    wheel_separation: 0.7
    max_speed: 3.0
    max_acceleration: 4.0
    priority: 2
    color: [0.3, 0.5, 0.8]
    sensors:
      lidar:
        update_rate: 10
        samples: 360
        min_range: 0.12
        max_range: 30.0
        noise_stddev: 0.01
      imu:
        update_rate: 200
      camera:
        update_rate: 30
        hfov: 1.2
        width: 640
        height: 480
        far_clip: 100

  # ---- 大型巴士 ----
  bus:
    mass: 200.0
    length: 3.0
    width: 1.0
    height: 0.6
    wheelbase: 2.0
    wheel_radius: 0.15
    wheel_width: 0.12
    wheel_separation: 0.9
    max_speed: 2.5
    max_acceleration: 2.0
    priority: 3
    color: [0.85, 0.6, 0.1]
    sensors:
      lidar:
        update_rate: 10
        samples: 720
        min_range: 0.15
        max_range: 50.0
        noise_stddev: 0.015
      imu:
        update_rate: 200
      camera:
        update_rate: 25
        hfov: 1.4
        width: 800
        height: 600
        far_clip: 200

  # ---- 高速巡逻车 ----
  patrol_car:
    mass: 60.0
    length: 1.4
    width: 0.7
    height: 0.35
    wheelbase: 0.9
    wheel_radius: 0.09
    wheel_width: 0.07
    wheel_separation: 0.6
    max_speed: 5.0
    max_acceleration: 6.0
    priority: 4
    color: [0.9, 0.15, 0.15]
    sensors:
      lidar:
        update_rate: 20
        samples: 360
        min_range: 0.1
        max_range: 40.0
        noise_stddev: 0.005
      imu:
        update_rate: 400
      camera:
        update_rate: 30
        hfov: 1.0
        width: 640
        height: 480
        far_clip: 150

  # ---- TurtleBot3 Burger（预置模型，复用 ROBOTIS 官方 SDF） ----
  tb3_burger:
    model_type: prebuilt
    model_name: turtlebot3_burger
    mass: 0.83
    length: 0.14
    width: 0.14
    height: 0.14
    wheelbase: 0.16
    wheel_radius: 0.033
    wheel_width: 0.018
    wheel_separation: 0.16
    max_speed: 0.22
    max_acceleration: 1.0
    priority: 1
    color: [0.3, 0.3, 0.3]
    sensors:
      lidar:
        update_rate: 5
        samples: 360
        min_range: 0.12
        max_range: 3.5
        noise_stddev: 0.01
      imu:
        update_rate: 200

  # ---- TurtleBot3 Waffle Pi（预置模型，含相机） ----
  tb3_waffle_pi:
    model_type: prebuilt
    model_name: turtlebot3_waffle_pi
    mass: 1.37
    length: 0.265
    width: 0.265
    height: 0.089
    wheelbase: 0.287
    wheel_radius: 0.033
    wheel_width: 0.018
    wheel_separation: 0.287
    max_speed: 0.26
    max_acceleration: 1.0
    priority: 2
    color: [0.3, 0.3, 0.3]
    sensors:
      lidar:
        update_rate: 5
        samples: 360
        min_range: 0.12
        max_range: 3.5
        noise_stddev: 0.01
      imu:
        update_rate: 200
      camera:
        update_rate: 30
        hfov: 1.0856
        width: 640
        height: 480
        far_clip: 100

# ============================================================================
# 实例车辆 —— 每辆引用一个预设，可覆盖任意字段
# ============================================================================
cars:
  - name: smart_car_1
    type: medium_car
    start: [2.0, -12.0, 1.5708]
    color: [0.15, 0.45, 0.85]
    max_speed: 2.5

  - name: smart_car_2
    type: delivery_bot
    start: [-3.0, -8.0, 1.5708]
    color: [0.2, 0.75, 0.35]

  - name: smart_car_3
    type: patrol_car
    start: [5.0, 5.0, 0.0]
    color: [0.9, 0.2, 0.15]
    max_speed: 4.0
    max_acceleration: 5.0

  # ---- TurtleBot3 预置模型实例 ----
  - name: tb3_1
    type: tb3_burger
    start: [-2.0, -0.5, 0.0]

  - name: tb3_2
    type: tb3_waffle_pi
    start: [0.5, -2.0, 0.0]
