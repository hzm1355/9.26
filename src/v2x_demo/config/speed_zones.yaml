# ============================================================================
# speed_zones.yaml —— 任务四（三）.(四) 测速路段仿真的点位与阈值
#
# 坐标是 world 帧米，必须落在 signal_drive_params.yaml 里两条真实环线的车道上，
# 否则节点跑起来就是零事件（regions.yaml 里早先预留的 SPEED-NS-A/B 在 y=-24/-12，
# 不在任何环线上，那两项只是底座占位，本文件才是测速模块的真值来源）。
#
# 路网（沙盘 10× 后 50 m × 50 m，2026-10 路线矫正后的车道中心）：
#   Ring A 西环 car_1：西行 y=-16.8、北行 x=-21.8、东行 y=1.5、南行 x=-0.8
#   Ring B 东环 car_4/car_5：北行 x=1.8、东行 y=1.5、南行 x=20.8、西行 y=-16.8
#   （car_2/car_3 在任务五里当停车场摆渡车，signal_drive_params.yaml 标了
#    drive: false，不在车流里；东腿 x 14.5→16.2→20.80 两次都是为让出停车场占地与
#    第三个原始车位，本文件的东环区间跟着挪、相对几何不变，见下面 SZ-B-east-segment）
# 巡航 0.7 m/s = 2.52 km/h，所以阈值按 km/h 写：2.0 必然告警、3.0 必然干净，
# 两者同时在线才能证明"阈值真的在起作用"，而不是无条件报警。
#
# 字段：
#   mode     instant=定点瞬时（雷达杆测过车点的瞬时读数）/ segment=区间平均
#            （依次通过 entry/exit 两断面的行程时间反算均速）
#   center   instant 点位的车道中心；entry/exit 是区间的两个断面中心
#   radius   触发半径 m：车中心进入该圆即算"通过断面"，离开即结束一次通行
#   radar    雷达杆位置（路侧），只影响波束夹角与测距，不影响触发判定
#   beam     波束轴朝向（度，world 帧，0=+x 逆时针）。雷达只能测到车速在波束轴上的
#            投影 v·cos(夹角)，这是真实固定测速雷达的余弦误差，仿真把它保留下来
#            并同时上报 speed_pose_kmh 作对照通道。留空则按通行方向自动取（夹角 0，
#            等效"正对来车"的标准装法）。
#   limit    限速阈值 km/h，可被 /speed/zones 服务就地热改
#   road     人读的路段名，进统计与导出
# ============================================================================
speed:
  # 雷达测量噪声（km/h，高斯 σ）。0 表示纯余弦模型、不掺噪声。
  radar_noise_kmh: 0.30
  # 判定用的最小速度：低于它视为停车排队，不计入车流量与均速（否则红灯排队会把均值拉没）
  min_pass_kmh: 0.30
  # 物理上限 km/h：窗口弦速超过它不可能是行驶，该帧直接不进判定。5 m 的弦长护栏拦不住
  # 小跳变——2 m 跳变除以 0.2 s 窗口就是 36 km/h，线上出过 20.08 的假告警和 44.77 的假峰。
  # 车队巡航只有 0.7 m/s = 2.52 km/h（signal_drive_params.yaml），12 已留了 4 倍余量。
  # 分两级：位移 ≤3 m 当作刮蹭抖动，只重攒窗口（当趟抓拍与在途区间通行保留）；
  #        位移 >3 m 判为整段复位，连同在途区间通行一起作废。
  max_sane_kmh: 12.0
  # 区间内滞留超过这么多秒就丢弃（车在半路被复位/卡死时不留悬案）
  segment_ttl_s: 300.0
  # 瞬时测速的速度窗口（仿真秒）：位姿流 ~97 Hz 而 /clock ~10 Hz（speed_diag_states.py 实测），
  # 逐帧 |Δp|/Δt 会拿一帧位移除一整格时钟、把速度缩到 1/10，所以按时钟格采样，
  # 取窗内**各子区间速度的中位数**（不是整窗弦长/整窗时长：那样一次 0.5 m 的刮蹭抖动
  # 落在 0.2 s 窗里就成 9 km/h，界面上就是假超速）。0.30 s = 3 格时钟，残差 ±3% 左右。
  vel_window_s: 0.30
  # 统计窗口长度与发布周期（秒）
  stats_window_s: 120.0
  stats_period_s: 10.0

  # 车牌真值兜底：/plate/number 是易失话题，节点晚于贴牌启动就看不到，
  # 所以这里留一份与 apply_default_plates.sh 一致的映射，运行期以话题为准。
  plates:
    car_1: 沪A12345
    car_2: 粤Z1A2B3
    car_3: 京B88990
    car_4: 苏E66F88
    car_5: 浙A66666

  zones:
    # ── 1 定点瞬时：Ring A 西环北行，阈值 2.0 → 巡航 2.52 必然超速 ──
    - id: SZ-A-west-instant
      mode: instant
      road: 西环北行车道 x=-21.8
      center: [-21.8, -5.0]
      radius: 1.6
      radar: [-19.6, -5.0]
      beam: 90.0
      limit_kmh: 2.0

    # ── 2 定点瞬时：Ring B 北环东行，阈值 4.0 → 同车速必然干净（对照组）──
    - id: SZ-B-north-instant
      mode: instant
      road: 北环东行车道 y=1.5
      center: [9.0, 1.5]
      radius: 1.6
      radar: [9.0, -0.7]
      beam: 0.0
      limit_kmh: 4.0

    # ── 3 定点瞬时：Ring B 南环西行，阈值 2.0 → 超速 ──
    - id: SZ-B-south-instant
      mode: instant
      road: 南环西行车道 y=-16.8
      center: [9.0, -16.8]
      radius: 1.6
      radar: [9.0, -14.6]
      beam: 180.0
      limit_kmh: 2.0

    # ── 4 区间平均：Ring A 南环西行，entry→exit 11 m，阈值 2.0 → 超速 ──
    - id: SZ-A-south-segment
      mode: segment
      road: 南环西行车道（Ring A）
      entry: [-5.0, -16.8]
      exit: [-16.0, -16.8]
      radius: 1.6
      radar: [-5.0, -14.6]
      beam: 180.0
      limit_kmh: 2.0

    # ── 5 区间平均：Ring B 东环南行，entry→exit 12.5 m，阈值 3.0 → 干净（对照组）──
    # 东腿 2026-10-14 从 x=14.5 挪到 16.2、同日再挪到 x=20.80（停车场占地东缘 16.50 +
    # 车体半宽 0.40 + 余量 0.15 之后，16.20 那条带的包络 15.75..16.65 仍横穿第三个原始
    # 车位 PKG-P3；实测 17.05~17.4 之间只剩 0.9 m 缝且被两处景观件截断，所以整条腿外绕，
    # 判据 tools/route_lot_conflict.py、净空 tools/pk128_newleg238.sh）。这一段的
    # entry/exit 与雷达一起 +4.60 m，相对几何一字不变：雷达仍在车道以西 2.20 m、
    # beam -90 正对南行车流，与北环那条同一套安装口径。
    - id: SZ-B-east-segment
      mode: segment
      road: 东环南行车道（Ring B）
      entry: [20.8, 0.5]
      exit: [20.8, -12.0]
      radius: 1.6
      radar: [18.6, 0.5]
      beam: -90.0
      limit_kmh: 3.0
