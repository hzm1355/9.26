# 多车交通流配置 —— traffic_flow_node.py 读取（对应协议 §三.(一) 多车仿真）
# 坐标系：world，单位米/弧度。J1 主十字路口为原点，NS 路沿 x=0，EW 路沿 y=0。
# 车道：每向 2 车道、宽 3.0、中央分隔 0.2 -> 半幅 6.4；靠右行驶，
#   北向车道中心 x≈+1.6/+4.6，南向 x≈-1.6/-4.6；东向 y≈-1.6/-4.6，西向 y≈+1.6/+4.6。
# 每辆车名以 v2x_ 前缀 -> 自动被区域触发底座与轨迹记录器识别。
# route：途经点折线，车辆到端点后自动折返往返；start：[x, y, yaw]。

cars:
  - name: v2x_car_n1
    start: [1.6, -25.0, 1.5708]        # 北向，车头 +y
    color: [0.15, 0.45, 0.85]
    speed: 3.5
    route: [[1.6, -25.0], [1.6, -8.0], [1.6, 8.0], [1.6, 25.0]]

  - name: v2x_car_s1
    start: [-1.6, 20.0, -1.5708]       # 南向，车头 -y
    color: [0.90, 0.30, 0.20]
    speed: 3.0
    route: [[-1.6, 20.0], [-1.6, 5.0], [-1.6, -12.0], [-1.6, -33.0]]

  - name: v2x_car_e1
    start: [-25.0, -1.6, 0.0]          # 东向，车头 +x
    color: [0.95, 0.75, 0.10]
    speed: 2.8
    route: [[-25.0, -1.6], [-8.0, -1.6], [8.0, -1.6], [25.0, -1.6]]

  - name: v2x_car_w1
    start: [25.0, 1.6, 3.14159]        # 西向，车头 -x
    color: [0.30, 0.75, 0.45]
    speed: 2.6
    route: [[25.0, 1.6], [8.0, 1.6], [-8.0, 1.6], [-25.0, 1.6]]
